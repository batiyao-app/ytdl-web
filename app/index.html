<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>YTDL Web</title><link rel="stylesheet" href="style.css"></head><body><main><nav><button id="home-tab" aria-pressed="true">Download</button><button id="library-tab" aria-pressed="false">Library <span id="count">0</span></button></nav><section id="home"><p class="eyebrow">YTDL WEB · ON DEVICE</p><h1>Your media.<br>Your space.</h1><form id="form"><label for="url">Video or playlist URL</label><input id="url" type="url" placeholder="Paste a YouTube link" required><fieldset><legend>Download as</legend><label class="choice"><input name="format" value="mp4" type="radio" checked><span><strong>Video</strong><small>MP4 · Picture + sound</small></span></label><label class="choice"><input name="format" value="mp3" type="radio"><span><strong>Audio</strong><small>MP3 · Sound only</small></span></label></fieldset><button id="start" class="primary">Download video · MP4</button><button id="stop" type="button" hidden>Stop download</button></form><progress id="progress" hidden></progress><p id="status" role="status" aria-live="polite"></p><ol id="queue"></ol></section><section id="library" hidden><p class="eyebrow">YOUR LIBRARY</p><h1>Ready to play.</h1><p id="storage-note"></p><button id="play-all" class="primary">Play all</button><p id="library-status" role="status"></p><div id="undo" hidden><span>Removed from library.</span><button id="restore">Undo</button></div><ul id="files"></ul><video id="player" playsinline controls hidden></video></section><footer>Only enter content you own and have permission to download and convert. Respect applicable platform terms.</footer></main><script src="batiyao-miniapp.js"></script><script src="app.js"></script></body></html>
